
<h2 class="sr-only">6岁男孩羽毛球16周教学计划，包含4个阶段和每日训练内容，点击切换阶段和周次</h2>
<div style="padding:1rem 0 2rem;">

<div style="display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;">
  <div style="width:44px;height:44px;border-radius:50%;background:var(--color-background-success);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
    <i class="ti ti-heart" style="font-size:20px;color:var(--color-text-success);" aria-hidden="true"></i>
  </div>
  <div>
    <div style="font-size:18px;font-weight:500;color:var(--color-text-primary);">6岁男孩羽毛球系统教学</div>
    <div style="font-size:13px;color:var(--color-text-secondary);margin-top:2px;">16周计划 · 亲子共练 · 每日1–2小时</div>
  </div>
  <div style="margin-left:auto;display:flex;gap:6px;">
    <span style="background:var(--color-background-info);color:var(--color-text-info);font-size:12px;padding:3px 10px;border-radius:var(--border-radius-md);">4 阶段</span>
    <span style="background:var(--color-background-success);color:var(--color-text-success);font-size:12px;padding:3px 10px;border-radius:var(--border-radius-md);">16 周</span>
  </div>
</div>

<div id="ptabs" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:1rem;"></div>
<div id="pgoal" style="margin-bottom:1rem;"></div>
<div id="wtabs" style="display:flex;gap:8px;margin-bottom:1rem;"></div>
<div id="sessions"></div>
<div id="timebar" style="margin:8px 0 1.5rem;"></div>

<button onclick="tt()" style="width:100%;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;font-size:14px;color:var(--color-text-primary);margin-bottom:8px;">
  <i class="ti ti-bulb" style="font-size:16px;color:var(--color-text-warning);" aria-hidden="true"></i>
  家长教学贴士
  <i class="ti ti-chevron-down" id="ta" style="margin-left:auto;font-size:14px;transition:transform 0.2s;" aria-hidden="true"></i>
</button>
<div id="tpanel" style="display:none;margin-bottom:1.5rem;"></div>

<div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;">
  <div style="font-size:14px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--color-text-primary);">
    <i class="ti ti-shopping-cart" style="font-size:16px;color:var(--color-text-secondary);" aria-hidden="true"></i>
    装备建议
  </div>
  <div id="eq"></div>
</div>

</div>

<script>
const DATA=[
  {sem:'success',title:'球感建立',period:'1–4周',icon:'ti-heart',
   goal:'让孩子爱上球拍，建立手眼协调与基本球感',
   weeks:[
    {l:'第1–2周',t:'认识球拍与球',ss:[
      {n:'热身',d:10,lk:'success',ls:['慢跑绕场热身1圈','模仿小动物走路（螃蟹步、青蛙跳）','手腕绕圈各方向活动 × 10']},
      {n:'核心训练',d:40,lk:'info',ls:['握拍：正手握拍（握手式），家长检查虎口是否夹住拍柄','颠球：正手面连续颠球，目标 5→10→20 个不落地','抛接：家长抛球，孩子用球拍接住（不要求打出）','自抛自打：孩子向上抛球，正手轻轻击打']},
      {n:'趣味游戏',d:20,lk:'warning',ls:['气球羽毛球：用气球替代，飞得慢更容易上手','颠球比赛：看谁连续次数最多，互相挑战']}
    ]},
    {l:'第3–4周',t:'基础站姿与步伐',ss:[
      {n:'热身',d:10,lk:'success',ls:['跳绳 50 下','侧滑步左右各 10 次','踮脚尖走一圈']},
      {n:'核心训练',d:45,lk:'info',ls:['准备姿势：双脚与肩同宽，微蹲，重心前脚掌，眼睛平视','左右移步：家长喊方向，孩子侧滑步移动（要滑不要跑）','前后移步：前进两步→回中心→后退两步，循环 15 次','影子练习：家长示范，孩子无球模仿动作（步伐+挥拍）']},
      {n:'趣味游戏',d:20,lk:'warning',ls:['Simon Says（用羽毛球动作当指令）','地板格子：贴胶带画格子，按指令快速踩格']}
    ]}
  ]},
  {sem:'info',title:'基础击球',period:'5–8周',icon:'ti-arrow-right',
   goal:'掌握正手高远球和基础发球，能完成简单对打',
   weeks:[
    {l:'第5–6周',t:'正手高远球',ss:[
      {n:'热身',d:10,lk:'success',ls:['慢跑 + 手臂前后甩动各 20 次','模拟投球动作热身 20 次','肩关节环绕 × 10']},
      {n:'核心训练',d:50,lk:'info',ls:['动作引导：像扔石头一样把球扔到远处，借投球感找发力','分解动作：引拍→转体→挥拍→随挥，每个分解单独做 10 次','固定球：家长手持球固定，孩子练习完整击球动作','抛球喂练：家长向上高抛球，孩子正手打高远球 × 30 球','目标练习：设置落点标记（如贴纸），看能否打到']},
      {n:'趣味游戏',d:20,lk:'warning',ls:['打气球挑战：正手尽力把气球打远','距离挑战：看谁能把球打过最远的标志线']}
    ]},
    {l:'第7–8周',t:'发球练习',ss:[
      {n:'热身',d:10,lk:'success',ls:['模拟发球动作 × 20 次慢速热身','手腕灵活：内外翻转 × 15']},
      {n:'核心训练',d:45,lk:'info',ls:['正手发高远球：左手持球松开→右手正手击打，动作要慢','发球站位：练习站在正确发球区，左脚在前，重心稳','连续发球：每组 20–30 球，共 3 组，关注动作一致性','简单对打：家长发球，孩子随意回球（重点是接触球）']},
      {n:'趣味游戏',d:20,lk:'warning',ls:['发球计分：发到后场目标区得 1 分，连发 10 球看总分','亲子对打 5 分赛（家长适当放水，让孩子体验成就感）']}
    ]}
  ]},
  {sem:'warning',title:'技术拓展',period:'9–12周',icon:'ti-chart-bar',
   goal:'学习反手技术与网前小球，初步建立战术意识',
   weeks:[
    {l:'第9–10周',t:'反手基础',ss:[
      {n:'热身',d:10,lk:'success',ls:['正手高远球热身 10 球（每次必练的基础）','手腕反转练习 × 15 次']},
      {n:'核心训练',d:50,lk:'info',ls:['反手握拍：从正手快速换反手握拍，反复练习 20 次','反手感知：家长在孩子反手位低点抛球，孩子尝试接触','反手挡球：不要求打远，能稳定接触球就是成功','正反手交替：家长交替喂正手/反手位球，孩子移步接']},
      {n:'趣味游戏',d:20,lk:'warning',ls:['正反手随机接球（家长喊方向再抛球）','挑战：反手连续颠球 5 下，达成就奖励']}
    ]},
    {l:'第11–12周',t:'网前小球',ss:[
      {n:'热身',d:10,lk:'success',ls:['网前快步冲跑：前后各 10 次','踝关节环绕活动']},
      {n:'核心训练',d:45,lk:'info',ls:['网前推球：轻柔把球推过网，落点越近越好','网前勾对角：从网前斜向打到对角，感受斜线路线','后场→网前移动：家长打深球，孩子退步再冲网前接','起跳触球引导：网前尝试跳起击球，感受节奏即可']},
      {n:'趣味游戏',d:20,lk:'warning',ls:['网前专项赛：只能打网前球，先失误者输','亲子配合：家长后场控制，孩子专职网前']}
    ]}
  ]},
  {sem:'danger',title:'实战应用',period:'13–16周',icon:'ti-star',
   goal:'综合运用所学技术，在真实比赛中体验羽毛球的乐趣',
   weeks:[
    {l:'第13–14周',t:'综合技术对打',ss:[
      {n:'热身',d:10,lk:'success',ls:['正手高远球热身 20 球','步伐综合移动（前后左右）']},
      {n:'核心训练',d:50,lk:'info',ls:['多球喂练：家长连续喂球（高远→网前→高远），孩子持续移动','薄弱项强化：针对孩子最弱的技术集中加强','战术引导：把球打到对手不容易跑到的地方','完整对打练习：尽量打出 15–20 拍的完整回合']},
      {n:'趣味游戏',d:20,lk:'warning',ls:['连续对打记录：今天能否打破最高拍数记录？','小比赛：先得 5 分获胜（3 局 2 胜制）']}
    ]},
    {l:'第15–16周',t:'趣味正式比赛',ss:[
      {n:'热身',d:10,lk:'success',ls:['完整热身：步伐+挥拍+拉伸全套','模拟比赛前例行准备']},
      {n:'核心训练',d:45,lk:'info',ls:['规则学习：发球区域、轮流发球、计分、换边规则','简化版比赛：11 分制，允许 2 次接球降低难度','赛后复盘：和孩子一起回顾哪里打得好，哪里改进']},
      {n:'趣味游戏',d:25,lk:'warning',ls:['正式亲子比赛（家长让分，让孩子体验赢球的成就感）','颁奖仪式：给孩子阶段性奖励，庆祝完成 16 周！']}
    ]}
  ]}
];

const TIPS=[
  {ic:'ti-clock',t:'控制专注时间',d:'6岁孩子专注时间约 15 分钟，每个练习项目不超过 15 分钟，多切换活动保持兴趣'},
  {ic:'ti-player-play',t:'游戏化训练',d:'把每个练习变成游戏，设置小目标和小奖励，孩子学得更快更开心'},
  {ic:'ti-heart',t:'多鼓励少纠错',d:'每次最多指出 1–2 个问题，先表扬做对的地方，再温和提出改进'},
  {ic:'ti-refresh',t:'重复是关键',d:'一个动作需要反复练才能形成肌肉记忆，不要急着进入下一阶段'},
  {ic:'ti-droplet',t:'及时补充水分',d:'每 20–30 分钟休息一次补水，防止孩子脱水，特别是夏天室外练球'},
  {ic:'ti-star',t:'以开心为第一',d:'孩子不耐烦或疲劳时立即停止，强行练习会产生负面情绪，损害长期兴趣'}
];

const EQ=[
  {n:'儿童球拍',s:'21–23 英寸，整体约 70–75g',tip:'铝碳合金，初学不用买太贵'},
  {n:'羽毛球',s:'室内用羽毛球，耐用选尼龙球',tip:'多备几筒，孩子消耗快'},
  {n:'运动鞋',s:'羽毛球专用鞋或普通运动鞋',tip:'防侧滑保护踝关节最重要'},
  {n:'运动服',s:'轻便透气运动套装',tip:'方便大幅度活动即可'}
];

const SIC=['ti-player-play','ti-check','ti-star'];
const SCLR=['#1D9E75','#185FA5','#BA7517'];
let cp=0,cw=0,to=false;

function bg(s){return`var(--color-background-${s})`;}
function tc(s){return`var(--color-text-${s})`;}
function bc(s){return`var(--color-border-${s})`;}

function rPT(){
  document.getElementById('ptabs').innerHTML=DATA.map((p,i)=>
    `<button onclick="sP(${i})" style="flex:0 0 auto;padding:8px 14px;line-height:1.4;border-radius:var(--border-radius-md);border:0.5px solid ${cp===i?bc(p.sem):'var(--color-border-tertiary)'};background:${cp===i?bg(p.sem):'var(--color-background-primary)'};color:${cp===i?tc(p.sem):'var(--color-text-secondary)'};font-weight:${cp===i?500:400};font-size:13px;cursor:pointer;white-space:nowrap;">
      <i class="ti ${p.icon}" style="font-size:13px;vertical-align:-1px;margin-right:4px;" aria-hidden="true"></i>${p.title}<br>
      <span style="font-size:11px;opacity:0.75;">第${p.period}</span>
    </button>`).join('');
}

function rPG(){
  const p=DATA[cp];
  document.getElementById('pgoal').innerHTML=
    `<div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;">
      <div style="width:36px;height:36px;border-radius:50%;background:${bg(p.sem)};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i class="ti ${p.icon}" style="font-size:17px;color:${tc(p.sem)};" aria-hidden="true"></i>
      </div>
      <div>
        <div style="font-size:14px;font-weight:500;color:var(--color-text-primary);">${p.title} · 第${p.period}</div>
        <div style="font-size:12px;color:var(--color-text-secondary);margin-top:3px;">目标：${p.goal}</div>
      </div>
    </div>`;
}

function rWT(){
  const p=DATA[cp];
  document.getElementById('wtabs').innerHTML=p.weeks.map((w,i)=>
    `<button onclick="sW(${i})" style="flex:1;padding:9px 8px;line-height:1.4;border-radius:var(--border-radius-md);border:0.5px solid ${cw===i?bc(p.sem):'var(--color-border-tertiary)'};background:${cw===i?bg(p.sem):'var(--color-background-primary)'};color:${cw===i?tc(p.sem):'var(--color-text-secondary)'};font-size:13px;font-weight:${cw===i?500:400};cursor:pointer;">
      ${w.l}<br><span style="font-size:11px;opacity:0.8;">${w.t}</span>
    </button>`).join('');
}

function rS(){
  const w=DATA[cp].weeks[cw];
  const tot=w.ss.reduce((s,x)=>s+x.d,0);
  document.getElementById('sessions').innerHTML=
    `<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:6px;">
      <i class="ti ti-edit" style="font-size:14px;color:var(--color-text-secondary);" aria-hidden="true"></i>
      <span style="font-size:13px;font-weight:500;color:var(--color-text-primary);">本周主题：${w.t}</span>
      <span style="margin-left:auto;font-size:12px;color:var(--color-text-secondary);">每日约 ${tot} 分钟</span>
    </div>
    ${w.ss.map((s,si)=>`
    <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <i class="ti ${SIC[si]}" style="font-size:16px;color:${SCLR[si]};" aria-hidden="true"></i>
        <span style="font-size:14px;font-weight:500;color:var(--color-text-primary);">${s.n}</span>
        <span style="margin-left:auto;background:${bg(s.lk)};color:${tc(s.lk)};font-size:11px;padding:2px 8px;border-radius:var(--border-radius-md);">
          <i class="ti ti-clock" style="font-size:11px;vertical-align:-1px;" aria-hidden="true"></i> ${s.d} 分钟
        </span>
      </div>
      ${s.ls.map((l,li)=>`<div style="font-size:13px;color:var(--color-text-primary);padding:5px 0 5px 14px;position:relative;${li<s.ls.length-1?'border-bottom:0.5px solid var(--color-border-tertiary);':''}"><span style="position:absolute;left:2px;color:var(--color-text-tertiary);">›</span>${l}</div>`).join('')}
    </div>`).join('')}`;
}

function rTB(){
  const w=DATA[cp].weeks[cw];
  const tot=w.ss.reduce((s,x)=>s+x.d,0);
  document.getElementById('timebar').innerHTML=
    `<div style="display:flex;height:4px;border-radius:2px;overflow:hidden;">
      ${w.ss.map((s,i)=>`<div style="flex:${s.d};background:${SCLR[i]};"></div>`).join('')}
    </div>
    <div style="display:flex;gap:16px;margin-top:6px;">
      ${w.ss.map((s,i)=>`<span style="font-size:11px;color:var(--color-text-secondary);display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;border-radius:50%;background:${SCLR[i]};display:inline-block;"></span>${s.n} ${Math.round(s.d/tot*100)}%</span>`).join('')}
    </div>`;
}

function rTips(){
  document.getElementById('tpanel').innerHTML=
    `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;">
      ${TIPS.map(t=>`
      <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem;">
        <i class="ti ${t.ic}" style="font-size:20px;color:var(--color-text-warning);display:block;margin-bottom:6px;" aria-hidden="true"></i>
        <div style="font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px;">${t.t}</div>
        <div style="font-size:12px;color:var(--color-text-secondary);line-height:1.6;">${t.d}</div>
      </div>`).join('')}
    </div>`;
}

function rEQ(){
  document.getElementById('eq').innerHTML=EQ.map((e,i)=>
    `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;${i<EQ.length-1?'border-bottom:0.5px solid var(--color-border-tertiary);':''}">
      <div style="width:28px;height:28px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--color-text-secondary);flex-shrink:0;">${i+1}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:500;color:var(--color-text-primary);">${e.n}</div>
        <div style="font-size:12px;color:var(--color-text-secondary);">${e.s}</div>
      </div>
      <div style="font-size:11px;color:var(--color-text-success);background:var(--color-background-success);padding:3px 8px;border-radius:var(--border-radius-md);white-space:nowrap;flex-shrink:0;">${e.tip}</div>
    </div>`).join('');
}

function sP(i){cp=i;cw=0;render();}
function sW(i){cw=i;render();}
function tt(){
  to=!to;
  document.getElementById('ta').style.transform=to?'rotate(180deg)':'';
  const p=document.getElementById('tpanel');
  p.style.display=to?'block':'none';
  if(to&&!p.innerHTML.trim())rTips();
}
function render(){rPT();rPG();rWT();rS();rTB();}
render();
rEQ();
</script>
