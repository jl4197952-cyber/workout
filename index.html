<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fdf8f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>居家轻盈计划</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Zhi+Mang+Xing&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fdf8f3;--bg-card:#ffffff;--bg-soft:#fbf1e7;
    --border:#ecdfd0;--border-soft:#f3e7d8;
    --text:#4a3f35;--text-dim:#9c8d7d;--text-faint:#c4b6a4;
    --peach:#e8a87c;--peach-soft:#fbe5d3;
    --sage:#9caf88;--sage-soft:#e8efe1;
    --rose:#d98a8a;--rose-soft:#f7e0e0;
    --sky:#8fb4c9;--sky-soft:#e3eef3;
    --serif:'Noto Serif SC',serif;
    --hand:'Zhi Mang Xing',cursive;
    --sans:'Nunito',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}
  .header{padding:calc(env(safe-area-inset-top)+20px) 20px 14px;background:var(--bg);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border-soft);}
  .greeting{font-family:var(--hand);font-size:20px;color:var(--peach);margin-bottom:2px;}
  .title{font-family:var(--serif);font-weight:600;font-size:25px;letter-spacing:-0.01em;margin:0;}
  .subtitle{font-family:var(--sans);font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
  .day-tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{flex:1;min-width:0;padding:10px 6px;background:var(--bg-card);border:1.5px solid var(--border);border-radius:14px;color:var(--text-dim);font-family:var(--sans);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s;text-align:center;}
  .day-tab .day-emoji{display:block;font-size:18px;margin-bottom:3px;}
  .day-tab.active{background:var(--peach);border-color:var(--peach);color:#fff;}
  .day-tab.completed::after{content:' 完成';color:var(--sage);font-size:9px;}
  .main{padding:20px;max-width:560px;margin:0 auto;}
  .day-banner{background:linear-gradient(135deg,var(--peach-soft) 0%,var(--bg) 100%);border-radius:20px;padding:20px;margin-bottom:18px;position:relative;overflow:hidden;}
  .day-banner-label{font-family:var(--sans);font-size:11px;color:var(--peach);font-weight:700;letter-spacing:0.05em;margin-bottom:4px;}
  .day-banner-title{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 8px;}
  .day-banner-desc{font-size:13px;color:var(--text-dim);line-height:1.6;}
  .progress-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11px;color:var(--text-dim);font-weight:600;}
  .progress-bar{flex:1;height:6px;background:#fff;border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:var(--peach);transition:width 0.3s ease-out;border-radius:3px;}
  .section-title{display:flex;align-items:center;gap:8px;margin:22px 0 12px;font-family:var(--serif);font-size:15px;font-weight:600;color:var(--text);}
  .section-title .dot{width:7px;height:7px;border-radius:50%;}
  .section-title.warmup .dot{background:var(--sky);}
  .section-title.main .dot{background:var(--peach);}
  .section-title.cardio .dot{background:var(--sage);}
  .section-title.cool .dot{background:var(--rose);}
  .tip-card{background:var(--sage-soft);border-radius:16px;padding:14px 16px;margin-bottom:16px;border:1px solid #d9e5cc;}
  .tip-card-title{font-size:11px;font-weight:700;color:#6b8054;margin-bottom:5px;}
  .tip-card-text{font-size:12.5px;line-height:1.65;color:#5a6b4a;}
  .exercise{background:var(--bg-card);border:1.5px solid var(--border-soft);border-radius:18px;padding:17px;margin-bottom:11px;transition:all 0.2s;box-shadow:0 1px 3px rgba(150,120,90,0.04);}
  .exercise.done{border-color:var(--sage);background:linear-gradient(180deg,var(--sage-soft) 0%,var(--bg-card) 60%);}
  .exercise.warmup-card{border-left:4px solid var(--sky);}
  .exercise.warmup-card.done{border-left-color:var(--sage);}
  .exercise.cardio-card{border-left:4px solid var(--sage);}
  .exercise.cool-card{border-left:4px solid var(--rose);}
  .exercise.cool-card.done{border-left-color:var(--sage);}
  .ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .exercise-name{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3;margin:0 0 6px;}
  .exercise-muscle{display:inline-block;font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:700;}
  .exercise-muscle.warm{color:#5d8aa3;background:var(--sky-soft);}
  .exercise-muscle.main{color:#b5723e;background:var(--peach-soft);}
  .exercise-muscle.cardio{color:#6b8054;background:var(--sage-soft);}
  .exercise-muscle.cool{color:#b06868;background:var(--rose-soft);}
  .specs{display:flex;gap:8px;margin:12px 0;}
  .spec{flex:1;background:var(--bg-soft);padding:9px 10px;border-radius:11px;text-align:center;}
  .spec-label{font-size:9.5px;color:var(--text-faint);font-weight:700;letter-spacing:0.03em;margin-bottom:3px;}
  .spec-value{font-size:13px;color:var(--text);font-weight:700;}
  .how-to{background:var(--bg-soft);padding:11px 12px;border-radius:12px;margin-bottom:10px;font-size:12.5px;line-height:1.65;color:var(--text-dim);}
  .how-to b{color:var(--text);}
  .sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .set-btn{min-width:46px;height:46px;padding:0 8px;border-radius:13px;background:var(--bg-soft);border:1.5px solid var(--border);color:var(--text-dim);font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;}
  .set-btn:active{transform:scale(0.93);}
  .set-btn.done{background:var(--sage);border-color:var(--sage);color:#fff;}
  .gentle-note{font-size:12px;line-height:1.6;color:var(--text-faint);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-style:italic;}
  .info-block{background:var(--bg-card);border:1.5px solid var(--border-soft);border-radius:18px;padding:20px;margin-bottom:14px;}
  .info-block.peach{border-color:var(--peach-soft);background:linear-gradient(180deg,#fff9f4 0%,var(--bg-card) 100%);}
  .info-title{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 10px;}
  .info-block p{font-size:13px;line-height:1.7;color:var(--text-dim);margin:6px 0;}
  .info-block p b{color:var(--text);}
  .info-block ul{padding-left:18px;margin:8px 0;font-size:13px;line-height:1.8;color:var(--text-dim);}
  .info-block li{margin-bottom:5px;}
  .info-block li b{color:var(--text);}
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0;}
  .week-day{text-align:center;padding:9px 2px;border-radius:11px;}
  .week-day .wd-label{font-size:9px;color:var(--text-faint);margin-bottom:4px;font-weight:700;}
  .week-day .wd-content{font-size:10.5px;line-height:1.3;font-weight:700;}
  .week-day.train{background:var(--peach-soft);}
  .week-day.train .wd-content{color:#b5723e;}
  .week-day.cardio{background:var(--sage-soft);}
  .week-day.cardio .wd-content{color:#6b8054;}
  .week-day.rest{background:var(--bg-soft);}
  .week-day.rest .wd-content{color:var(--text-faint);}
  .footer{padding:20px 20px 32px;display:flex;gap:10px;border-top:1px solid var(--border-soft);margin-top:20px;max-width:560px;margin-left:auto;margin-right:auto;}
  .btn{flex:1;padding:13px;background:var(--bg-card);border:1.5px solid var(--border);border-radius:14px;color:var(--text-dim);font-size:12px;font-weight:700;cursor:pointer;}
  .encourage{text-align:center;padding:18px;font-family:var(--hand);font-size:18px;color:var(--peach);}
</style>
</head>
<body>
<header class="header">
  <div class="greeting">给老婆的小计划 ⛅</div>
  <h1 class="title">居家轻盈计划</h1>
  <div class="subtitle">徒手 + 一对2.5kg哑铃 + 弹力带 · 零基础友好 · 一周3天</div>
  <div class="day-tabs" id="dayTabs"></div>
</header>
<main class="main" id="main"></main>
<div class="encourage" id="encourage"></div>
<div class="footer">
  <button class="btn" onclick="resetDay()">重置今天</button>
  <button class="btn" onclick="resetAll()">清空全部</button>
</div>

    <ul>
      <li><b>2.5kg哑铃够用吗？</b>够的。零基础阶段，轻重量配合正确动作就能看到效果，等练习几周觉得轻松了，再考虑加重量</li>
      <li><b>动作做不到标准怎么办？</b>完全没关系，比如俯卧撑做不了就跪姿做，深蹲蹲浅一点也可以，慢慢进步就好</li>
      <li><b>多久能看到变化？</b>一般坚持4-6周会感觉衣服变松、体态变好，体重变化因人而异，不用每天称重，一周称一次就够</li>
      <li><b>累了可以不练吗？</b>身体很累、没睡好、生理期不舒服的时候，可以跳过或者只做拉伸放松，不用勉强</li>
    </ul>
  </div>
`;

let state = loadState();
let currentDay = state.currentDay || 'day1';

function loadState() {
  try { const s = localStorage.getItem('wifeWorkoutState'); return s ? JSON.parse(s) : { warmup:{}, exercises:{}, stretches:{}, cardio:{}, currentDay:'day1' }; }
  catch(e) { return { warmup:{}, exercises:{}, stretches:{}, cardio:{}, currentDay:'day1' }; }
}
function saveState() { try { localStorage.setItem('wifeWorkoutState', JSON.stringify(state)); } catch(e){} }

function toggleItem(section, dayKey, idx, setIdx) {
  const key = `${section}_${dayKey}_${idx}_${setIdx}`;
  if (!state[section]) state[section] = {};
  state[section][key] = !state[section][key];
  saveState(); render();
}
function isItemDone(section, dayKey, idx, setIdx) {
  if (!state[section]) return false;
  return !!state[section][`${section}_${dayKey}_${idx}_${setIdx}`];
}
function switchDay(day) { currentDay = day; state.currentDay = day; saveState(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function resetDay() {
  if (!confirm('重置今天的记录？')) return;
  ['warmup','exercises','stretches','cardio'].forEach(sec => {
    if (state[sec]) Object.keys(state[sec]).forEach(k => { if(k.includes(`_${currentDay}_`)) delete state[sec][k]; });
  });
  saveState(); render();
}
function resetAll() {
  if (!confirm('清空全部记录？')) return;
  state = { warmup:{}, exercises:{}, stretches:{}, cardio:{}, currentDay:'day1' };
  saveState(); currentDay = 'day1'; render();
}

function isDayComplete(dayKey) {
  const day = PLAN[dayKey];
  const all = [
    ...day.warmup.map((_,i)=>({sec:'warmup',i,sets:1})),
    ...day.exercises.map((e,i)=>({sec:'exercises',i,sets:e.sets})),
    ...day.stretches.map((_,i)=>({sec:'stretches',i,sets:1})),
    ...(day.cardio||[]).map((_,i)=>({sec:'cardio',i,sets:1})),
  ];
  if (!all.length) return false;
  for (const item of all) for (let s=0;s<item.sets;s++) if (!isItemDone(item.sec,dayKey,item.i,s)) return false;
  return true;
}
function getDayProgress(dayKey) {
  const day = PLAN[dayKey];
  let total=0, done=0;
  const count=(arr,sec,setsFn)=>arr.forEach((e,i)=>{ const sets=setsFn?setsFn(e):1; for(let s=0;s<sets;s++){total++; if(isItemDone(sec,dayKey,i,s))done++;} });
  count(day.warmup,'warmup');
  count(day.exercises,'exercises',e=>e.sets);
  count(day.stretches,'stretches');
  count(day.cardio||[],'cardio');
  return {done,total,pct: total? done/total*100:0};
}

function buildSimpleCard(ex, dayKey, idx, sec, cls, muscleCls) {
  const done = isItemDone(sec, dayKey, idx, 0);
  return `<div class="exercise ${cls} ${done?'done':''}">
    <div class="ex-top">
      <div>
        <h3 class="exercise-name">${ex.name}</h3>
        <span class="exercise-muscle ${muscleCls}">${ex.tag}</span>
      </div>
    </div>
    <div class="how-to">${ex.info}</div>
    <div class="specs"><div class="spec"><div class="spec-label">时长/次数</div><div class="spec-value">${ex.reps}</div></div></div>
    <div class="sets"><button class="set-btn ${done?'done':''}" onclick="toggleItem('${sec}','${dayKey}',${idx},0)">✓ 完成</button></div>
    <div class="gentle-note">${ex.notes}</div>
  </div>`;
}

function buildExerciseCard(ex, dayKey, idx) {
  let allDone = true;
  const btns = [];
  for (let s=0;s<ex.sets;s++) {
    const done = isItemDone('exercises', dayKey, idx, s);
    if (!done) allDone = false;
    btns.push(`<button class="set-btn ${done?'done':''}" onclick="toggleItem('exercises','${dayKey}',${idx},${s})">第${s+1}组</button>`);
  }
  return `<div class="exercise ${allDone?'done':''}">
    <h3 class="exercise-name">${ex.name}</h3>
    <span class="exercise-muscle main">${ex.muscle}</span>
    <div class="how-to">${ex.info}</div>
    <div class="specs">
      <div class="spec"><div class="spec-label">组数</div><div class="spec-value">${ex.sets}组</div></div>
      <div class="spec"><div class="spec-label">每组</div><div class="spec-value">${ex.reps}</div></div>
      <div class="spec"><div class="spec-label">休息</div><div class="spec-value">${ex.rest}</div></div>
    </div>
    <div class="sets">${btns.join('')}</div>
    <div class="gentle-note">${ex.notes}</div>
  </div>`;
}

function render() {
  const days=[{key:'day1',emoji:'🌸',label:'周一'},{key:'day2',emoji:'🌿',label:'周三'},{key:'day3',emoji:'🍑',label:'周五'},{key:'info',emoji:'💌',label:'说明'}];
  document.getElementById('dayTabs').innerHTML = days.map(d=>{
    const complete = d.key!=='info' && isDayComplete(d.key) ? 'completed' : '';
    const active = currentDay===d.key ? 'active' : '';
    return `<div class="day-tab ${active} ${complete}" onclick="switchDay('${d.key}')"><span class="day-emoji">${d.emoji}</span>${d.label}</div>`;
  }).join('');

  const main = document.getElementById('main');
  const enc = document.getElementById('encourage');
  if (currentDay === 'info') {
    main.innerHTML = INFO_HTML;
    enc.textContent = '';
    return;
  }
  const day = PLAN[currentDay];
  const prog = getDayProgress(currentDay);
  main.innerHTML = `
    <div class="day-banner">
      <div class="day-banner-label">${day.emoji} TODAY</div>
      <h2 class="day-banner-title">${day.title}</h2>
      <div class="day-banner-desc">${day.desc}</div>
      <div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:${prog.pct}%"></div></div><span>${prog.done}/${prog.total}</span></div>
    </div>
    <div class="section-title warmup"><span class="dot"></span>先热热身</div>
    ${day.warmup.map((ex,i)=>buildSimpleCard(ex,currentDay,i,'warmup','warmup-card','warm')).join('')}
    <div class="section-title main"><span class="dot"></span>正式训练</div>
    ${day.exercises.map((ex,i)=>buildExerciseCard(ex,currentDay,i)).join('')}
    ${day.cardio.length ? `<div class="section-title cardio"><span class="dot"></span>有氧时间</div>${day.cardio.map((ex,i)=>buildSimpleCard(ex,currentDay,i,'cardio','cardio-card','cardio')).join('')}` : ''}
    <div class="section-title cool"><span class="dot"></span>放松拉伸</div>
    ${day.stretches.map((ex,i)=>buildSimpleCard(ex,currentDay,i,'stretches','cool-card','cool')).join('')}
  `;
  enc.textContent = isDayComplete(currentDay) ? '今天辛苦啦，做得很好 🌼' : '';
}

render();
</script>
</body>
</html>
